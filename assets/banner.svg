<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 55H900M0 110H900M0 165H900M150 0V220M300 0V220M450 0V220M600 0V220M750 0V220"/>
  </g>
  <path d="M30 150 H200 L225 150 L245 90 L275 190 L300 120 L320 150 H520 L545 150 L565 80 L595 185 L620 125 L640 150 H870"
        fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#4ade80">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M30 150 H200 L225 150 L245 90 L275 190 L300 120 L320 150 H520 L545 150 L565 80 L595 185 L620 125 L640 150 H870"/>
  </circle>
  <text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff">TestPulse
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#93c5fd">Telemetry for your pytest suite: pass rate, p95 speed, flaky tests
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>
</svg>
